[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "nila-ai"
version = "0.1.0"
description = "A local-first personal assistant with explicit memory and approved dry-run tools."
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
  "alembic>=1.14,<2",
  "fastapi>=0.115,<1",
  "filelock>=3.16,<4",
  "httpx>=0.28,<1",
  "keyring>=25,<26",
  "openai>=2,<3",
  "platformdirs>=4,<5",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "rich>=13.9,<15",
  "sqlalchemy>=2.0,<3",
  "typer>=0.15,<1",
  "uvicorn>=0.34,<1",
]

[project.scripts]
nila = "nila.cli.app:app"

[dependency-groups]
dev = [
  "mypy>=1.14,<2",
  "pytest>=8.3,<10",
  "pytest-asyncio>=0.25,<2",
  "ruff>=0.9,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/nila"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.11"
files = ["src/nila"]
strict = true

[tool.uv]
required-version = ">=0.8"
